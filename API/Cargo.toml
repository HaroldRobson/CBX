[package]
name = "API"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = "1.0.30"
alloy-primitives = "1.3.1"
alloy-signer = "1.0.30"
axum = "0.8.4"
dotenv = "0.15.0"
hex = "0.4.3"
lettre = "0.11.18"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "macros"] }
tokio = { version = "1.47.1", features = ["full"] }
